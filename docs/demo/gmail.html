<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send Guard demo · Gmail</title>
  <link rel="stylesheet" href="demo.css">
  <style>
    .mail { flex: 1; background: #f6f8fc; position: relative; min-width: 0; overflow: hidden; }
    .compose { position: absolute; left: 24px; right: 24px; top: 20px; bottom: 20px; max-width: 760px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.15); display: flex; flex-direction: column; color: #202124; }
    .compose .h { background: #f2f6fc; padding: 10px 16px; border-radius: 12px 12px 0 0; font-weight: 600; }
    .field { padding: 8px 16px; border-bottom: 1px solid #f1f3f4; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: #5f6368; min-height: 40px; }
    .chip { background: #e8eaed; border-radius: 12px; padding: 2px 10px; color: #202124; font-size: 13px; }
    .field input { border: 0; outline: 0; font: inherit; flex: 1; color: #202124; }
    .editor { flex: 1; padding: 14px 16px; outline: 0; line-height: 1.7; overflow-y: auto; }
    .foot { padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: #5f6368; font-size: 12px; }
    .send { background: #0b57d0; color: #fff; border-radius: 18px; padding: 8px 24px; font-weight: 600; cursor: pointer; user-select: none; }
  </style>
</head>
<body>
  <div class="banner" data-t="banner"></div>
  <div class="app">
    <aside class="side">
      <h2 data-t="recipients"></h2>
      <div class="seg" id="rcptSeg">
        <button data-n="0" data-t="none"></button>
        <button data-n="1" data-t="one" class="on"></button>
        <button data-n="3" data-t="three"></button>
      </div>
      <h2 data-t="pick"></h2>
      <p data-t="pickHint"></p>
      <div id="scenarios"></div>
    </aside>
    <main class="mail">
      <!-- 结构与 Gmail 撰写窗口一致：主题栏 subjectbox、收件人标签 data-hovercard-id、正文 g_editable、发送按钮 tooltip 含 (Ctrl-Enter) -->
      <div class="compose">
        <div class="h">New message</div>
        <div class="field" id="rcpt"></div>
        <div class="field"><input name="subjectbox" value="Re: this week"></div>
        <div class="editor" id="editor" contenteditable="true" g_editable="true" role="textbox"></div>
        <div class="foot">
          <div class="send" role="button" data-tooltip="Send (Ctrl-Enter)" id="send">Send</div>
          <span data-t="trySend"></span>
        </div>
      </div>
    </main>
  </div>
  <script src="demo-stub.js"></script>
  <script src="demo-app.js"></script>
  <script>
    var editor = document.getElementById("editor")
    var PEOPLE = [["Lily Chen", "lily@example.com"], ["Wang Lei", "wang@example.com"], ["Project team", "team@example.com"]]
    function setRecipients(n) {
      var box = document.getElementById("rcpt")
      box.innerHTML = "<span>To</span>"
      PEOPLE.slice(0, n).forEach(function (p) {
        var c = document.createElement("span")
        c.className = "chip"
        c.textContent = p[0]
        c.setAttribute("data-hovercard-id", p[1])
        box.appendChild(c)
      })
      document.querySelectorAll("#rcptSeg button").forEach(function (b) { b.classList.toggle("on", +b.dataset.n === n) })
    }
    document.querySelectorAll("#rcptSeg button").forEach(function (b) {
      b.addEventListener("click", function () { setRecipients(+b.dataset.n) })
    })
    setRecipients(1)
    // 模拟 Gmail 自己的发送：只有 Send Guard 放行后（或无需检查时）才会走到这里
    document.getElementById("send").addEventListener("click", function () {
      if (!editor.innerText.trim()) return
      SGDemo.toast(SGDemo.T.sentMail)
      editor.innerText = ""
    })
    SGDemo.scenarios(document.getElementById("scenarios"), function (text) {
      editor.innerText = text
      editor.focus()
    })
  </script>
  <script src="content-gmail.js"></script>
</body>
</html>
