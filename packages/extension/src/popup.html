<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send Guard</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; width: 340px; font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1a202c; background: #fff;
    }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #edf2f7; }
    header img { width: 22px; height: 22px; }
    header h1 { font-size: 15px; margin: 0; flex: 1; }
    header .ver { color: #a0aec0; font-size: 12px; }
    section { padding: 10px 14px; border-bottom: 1px solid #edf2f7; }
    h2 { font-size: 12px; font-weight: 600; color: #4a5568; margin: 0 0 6px; }
    input[type=text], input[type=password], textarea, select {
      width: 100%; font: inherit; padding: 6px 8px; border: 1px solid #cbd5e0; border-radius: 6px; background: #fff; color: inherit;
    }
    textarea { resize: vertical; min-height: 48px; }
    button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid #cbd5e0; background: #fff; cursor: pointer; color: #2d3748; }
    button.primary { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row + .row { margin-top: 6px; }
    .grow { flex: 1; }
    .muted { color: #718096; font-size: 12px; }
    .ok { color: #2f855a; }
    .bad { color: #c53030; }
    .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #edf2f7; color: #4a5568; white-space: nowrap; }
    .tag.verified { background: #ebf8ff; color: #2b6cb0; }
    label.choice { display: flex; gap: 6px; align-items: flex-start; margin: 3px 0; cursor: pointer; }
    label.choice input { margin-top: 3px; }
    .consent { margin: 4px 0 0 22px; padding: 6px 8px; background: #fffaf0; border: 1px solid #fbd38d; border-radius: 6px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
    li .origin { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li button { padding: 1px 8px; font-size: 12px; }
    footer { padding: 10px 14px; color: #4a5568; font-size: 12px; background: #f7fafc; }
    .switch { display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon.svg" alt="">
    <h1>Send Guard</h1>
    <span class="ver" id="version"></span>
  </header>

  <section class="switch">
    <strong data-i18n="enable"></strong>
    <input type="checkbox" id="enabled">
  </section>

  <section>
    <h2 data-i18n="currentSite"></h2>
    <div class="row">
      <span class="grow" id="siteName">—</span>
      <span class="tag" id="siteTag"></span>
    </div>
    <div class="row">
      <button class="primary" id="enableSite" hidden data-i18n="enableSite"></button>
      <button id="manualCheck" hidden data-i18n="manualCheck"></button>
    </div>
    <div class="muted" id="siteMsg"></div>
  </section>

  <section>
    <h2 data-i18n="service"></h2>
    <div class="row">
      <select id="provider" class="grow">
        <option value="jev" data-i18n="providerJev"></option>
        <option value="deepseek" data-i18n="providerDeepseek"></option>
        <option value="openrouter" data-i18n="providerOpenrouter"></option>
      </select>
    </div>
    <div class="muted" id="providerNote"></div>
    <div class="row">
      <input type="password" id="apiKey" class="grow" autocomplete="off" spellcheck="false">
    </div>
    <div class="row" id="modelRow">
      <input type="text" id="model" class="grow" spellcheck="false" maxlength="100">
    </div>
    <div class="row">
      <button class="primary" id="saveKey" data-i18n="saveKey"></button>
      <span class="muted" id="keyMsg"></span>
    </div>
  </section>

  <section>
    <h2 data-i18n="mode"></h2>
    <label class="choice"><input type="radio" name="mode" value="presend" id="modePresend">
      <span><span data-i18n="modePresend"></span><br><span class="muted" data-i18n="modePresendHint"></span></span></label>
    <label class="choice"><input type="radio" name="mode" value="realtime" id="modeRealtime">
      <span><span data-i18n="modeRealtime"></span><br><span class="muted" data-i18n="modeRealtimeHint"></span></span></label>
    <label class="choice consent" id="consentBox" hidden><input type="checkbox" id="consent">
      <span data-i18n="consent"></span></label>
  </section>

  <section>
    <h2 data-i18n="recipient"></h2>
    <div class="row">
      <input type="text" id="recipientContext" class="grow" data-i18n-ph="recipientPlaceholder" maxlength="200">
      <select id="relationship" style="width: 100px">
        <option value="" data-i18n="relNone"></option>
        <option value="colleague" data-i18n="relColleague"></option>
        <option value="friend" data-i18n="relFriend"></option>
        <option value="stranger" data-i18n="relStranger"></option>
        <option value="group" data-i18n="relGroup"></option>
        <option value="other" data-i18n="relOther"></option>
      </select>
    </div>
    <label class="choice"><input type="checkbox" id="autoAudience">
      <span><span data-i18n="autoAudience"></span><br><span class="muted" data-i18n="autoAudienceHint"></span></span></label>
  </section>

  <section>
    <h2 data-i18n="words"></h2>
    <textarea id="sensitiveWords" data-i18n-ph="wordsPlaceholder"></textarea>
    <div class="muted" data-i18n="wordsHint"></div>
  </section>

  <section>
    <h2 data-i18n="sites"></h2>
    <ul id="sites"></ul>
    <div class="muted" id="sitesEmpty" data-i18n="sitesEmpty"></div>
  </section>

  <footer>
    <div id="statsLine"></div>
    <div id="costLine"></div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
